name: Validate porting tools

on:
  push:
    branches-ignore:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile tools
        run: python -m py_compile tools/port_assets.py tools/test_port_assets.py

      - name: Run synthetic tool tests
        run: python tools/test_port_assets.py
