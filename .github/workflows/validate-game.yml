name: Validate original game

on:
  push:
    branches-ignore:
      - master
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node --check game.js

      - name: Run headless gameplay regression tests
        run: node tools/test_game.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build release archive
        run: python tools/build_release.py

      - name: Verify archive exists
        run: test -s dist/Slingstone-2.1.0.zip
