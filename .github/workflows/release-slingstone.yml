name: Release Slingstone

on:
  push:
    tags:
      - "v*-slingstone"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check game syntax
        run: node --check game.js

      - name: Run headless gameplay regression tests
        run: node tools/test_game.js

      - name: Build release archive
        run: python tools/build_release.py

      - name: Create GitHub Release with asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Slingstone-2.1.0.zip \
            --title "Slingstone $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES_SLINGSTONE.md
