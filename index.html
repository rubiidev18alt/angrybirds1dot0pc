<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slingstone — original physics puzzle game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Slingstone</h1>
      <p class="subtitle">An original open-source slingshot physics game</p>
    </header>

    <div class="hud">
      <span id="levelLabel" class="pill">Level 1</span>
      <span id="scoreLabel" class="pill">Score: 0</span>
      <span id="shotsLabel" class="pill">Shots: 5</span>
      <button id="restartBtn" type="button">Restart</button>
      <button id="nextBtn" type="button" disabled>Next Level</button>
    </div>

    <canvas id="game" width="960" height="600" aria-label="Slingstone game canvas"></canvas>

    <div id="message" class="message hidden" role="status"></div>
    <p class="hint">Drag the stone back from the slingshot and release. Pop every glowing orb to win.</p>

    <footer>
      <p>Original game code, art, and audio. Built for PC browsers. No third-party game assets.</p>
      <p><a href="https://github.com/rubiidev18alt/angrybirds1dot0pc">Repository</a> · <a href="docs/GAME_DESIGN.md">Design notes</a></p>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
